<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drucka — Custom T-Shirts, Photo Frames & Personalized Gifts Online India</title>
    <meta
      name="description"
      content="Design custom printed t-shirts, personalized mugs, photo frames & canvas online with Drucka. Premium print-on-demand studio from Kolhapur, delivered across India in 2–4 days."
    />
    <meta
      name="keywords"
      content="custom t-shirts in India, personalized mugs, photo frames online, custom printing Kolhapur, photo prints online, canvas prints India, custom gifts India, print on demand, framed prints, custom hoodies"
    />
    <meta name="author" content="Drucka" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- charcoal, matching the announcement bar / header the browser chrome sits above -->
    <meta name="theme-color" content="#211c17" />
    <link rel="canonical" href="https://www.drucka.in/" />

    <!-- Preload the above-the-fold hero image (LCP) -->
    <link rel="preload" as="image" href="/images/hero/hero-1.webp" fetchpriority="high" />

    <!-- Local SEO (Kolhapur, Maharashtra) -->
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Kolhapur" />

    <!-- Open Graph / Facebook / WhatsApp link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Drucka" />
    <meta property="og:title" content="Drucka — Custom T-Shirts, Photo Frames & Personalized Gifts Online India" />
    <meta
      property="og:description"
      content="Custom printed t-shirts, personalized mugs, photo frames & canvas. Premium print-on-demand from Kolhapur, delivered across India in 2–4 days."
    />
    <meta property="og:url" content="https://www.drucka.in/" />
    <meta property="og:image" content="https://www.drucka.in/images/hero-lifestyle.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Drucka — Custom T-Shirts, Photo Frames & Personalized Gifts Online India" />
    <meta
      name="twitter:description"
      content="Custom printed t-shirts, personalized mugs, photo frames & canvas. Print-on-demand from Kolhapur, delivered across India in 2–4 days."
    />
    <meta name="twitter:image" content="https://www.drucka.in/images/hero-lifestyle.jpg" />

    <!-- Structured data: local business + site (helps Google Maps / local search) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "OnlineStore",
            "@id": "https://www.drucka.in/#business",
            "name": "Drucka",
            "alternateName": "Drucka Print Studio",
            "description": "Online custom printing store — custom t-shirts, personalized mugs, photo frames, canvas and gifts, printed on demand and delivered across India.",
            "url": "https://www.drucka.in/",
            "image": "https://www.drucka.in/images/hero-lifestyle.jpg",
            "telephone": "+917083811355",
            "email": "hello@drucka.in",
            "priceRange": "₹₹",
            "currenciesAccepted": "INR",
            "paymentAccepted": "UPI, Cash on Delivery, Cards, Net Banking",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Kolhapur",
              "addressRegion": "Maharashtra",
              "postalCode": "416001",
              "addressCountry": "IN"
            },
            "areaServed": { "@type": "Country", "name": "India" },
            "sameAs": ["https://instagram.com/druc.ka"]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.drucka.in/#website",
            "url": "https://www.drucka.in/",
            "name": "Drucka",
            "publisher": { "@id": "https://www.drucka.in/#business" },
            "inLanguage": "en-IN"
          }
        ]
      }
    </script>
    <!-- Fonts are self-hosted via @fontsource (imported in main.jsx) — no render-blocking Google Fonts request -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />

    <!-- Meta Pixel: loaded from src/lib/metaPixel.js (initPixel, called in
         main.jsx), gated to production builds only. It used to be an
         unconditional script here, which meant every staging preview and
         every local `npm run dev` / QA session sent real PageView /
         InitiateCheckout / Purchase events to the live Meta account. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
